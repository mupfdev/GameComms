name: ci

on:
  push:
  pull_request:

jobs:
  host-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: D-Bus modules for the BlueZ test (system Python)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y dbus python3-dbus python3-gi
      - name: Configure
        run: cmake -S tests -B build/tests -DGC_SANITIZE=${{ matrix.os == 'ubuntu-latest' && 'ON' || 'OFF' }}
      - name: Build
        run: cmake --build build/tests --config Debug
      - name: Test
        run: ctest --test-dir build/tests -C Debug --output-on-failure

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker image (builds and unit-tests the server)
        run: docker build -t gamecommsd -f server/Dockerfile .

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: PlatformIO
        run: pip install platformio
      - name: Build ESP32 firmware
        run: pio run -d firmware
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: firmware/.pio/build/esp32dev/firmware.bin

  pcbridge-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -S pcbridge -B build/pcbridge -DCMAKE_BUILD_TYPE=Release
          cmake --build build/pcbridge
          mkdir -p dist && cp build/pcbridge/gcbridge pcbridge/gcbridge.ini dist/
      - uses: actions/upload-artifact@v4
        with:
          name: gcbridge-linux-x86_64
          path: dist/

  pcbridge-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S pcbridge -B build/pcbridge
      - name: Build
        run: cmake --build build/pcbridge --config Release
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/pcbridge/Release/gcbridge.exe dist/
          Copy-Item pcbridge/gcbridge.ini dist/
      - uses: actions/upload-artifact@v4
        with:
          name: gcbridge-windows
          path: dist/
