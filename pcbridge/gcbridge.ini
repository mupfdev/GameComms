# GameComms PC bridge settings.
# Put this file next to gcbridge.exe (or start it with -c FILE).
# Every setting can also be given on the command line, e.g. --server=myhost

# Server address. auto = find a server on the local network.
server = auto

# Server port.
port = 9888

# Access key, only if the server requires one.
key =

# PIN that is answered automatically when an N-Gage pairs with this PC.
# Leave empty to confirm pairing requests in Windows instead.
pin = 1234

# Name of the Bluetooth service.
name = GameComms Bridge

# Number of N-Gages that can use this PC at the same time (1 to 7).
max_devices = 4

# 0 = errors, 1 = warnings, 2 = information, 3 = debug
log_level = 2
