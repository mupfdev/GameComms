# GameComms endpoint server configuration (gamecommsd -c gamecommsd.conf)

# TCP port for bridges; the same UDP port answers LAN discovery
port = 9888
# Loopback by default; use a secured tunnel for remote bridge connections.
bind = 127.0.0.1
# Set to 1 only when binding to a secured VPN/tunnel interface.
allow_plaintext_network = 0
discovery = 1

# shown to devices in REGISTERED
name = GameComms

# Required with allow_plaintext_network=1; bridges must use the same key
# ("set key ..." on the bridge console). The key is sent in cleartext and
# does not secure TCP; remote access must use a trusted VPN/tunnel.
# access_key = change-me

max_peers = 512
max_sessions = 256

# keep a silent bridge connection resumable (ms)
link_grace_ms = 20000
# keep the slot of a lost player in a running game (ms)
reserve_ms = 180000
# how long a join may wait for the host's confirmation (ms)
pending_ms = 60000

# abuse limits (see docs/BUILD.md)
hello_timeout_ms = 10000
max_auth_failures = 3
max_conns_per_ip = 16
conn_burst = 10
conn_rate = 2
# per-address limits for loopback clients (local tunnels share 127.0.0.1)
limit_loopback = 0

# 0 errors, 1 warnings, 2 info, 3 debug
log_level = 2
# log_file = /var/log/gamecommsd.log
status_interval = 300
